# Publica una versión nueva: compila en GitHub el instalador de Windows y los paquetes de Linux
# (AppImage, .deb y .rpm) y crea la release con ellos y el latest.json que usan las apps
# instaladas para actualizarse solas.
#
# No hace falta tocar nada aquí: `npm run release -- "novedad 1" "novedad 2"` (tools/release.mjs)
# sube la versión, crea la etiqueta vX.Y.Z y la empuja; eso lanza este flujo.
# Necesita el secreto TAURI_SIGNING_PRIVATE_KEY (clave privada de ~/.tauri/autogiro-updater.key).
#
# Windows y Linux se compilan a la vez; la release se publica cuando acaban los dos. Si falla
# solo Linux, se publica igualmente con lo de Windows (las copias de Linux no se actualizan
# hasta la versión siguiente); si falla Windows, no se publica nada.

name: Publicar versión

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  windows:
    name: Instalador de Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Compilar el juego y el instalador
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build --ci --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: src-tauri/target/release/bundle/nsis/Autogiro_*-setup.exe*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Paquetes de Linux
    # la versión de Ubuntu más antigua que hay: lo compilado aquí funciona en las distribuciones
    # con una glibc igual o más nueva (Ubuntu 22.04, Debian 12, Fedora 36 y posteriores)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Bibliotecas de WebKitGTK y GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Compilar el juego y los paquetes
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: npx tauri build --ci --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/Autogiro_*.AppImage*
            src-tauri/target/release/bundle/deb/Autogiro_*.deb*
            src-tauri/target/release/bundle/rpm/Autogiro-*.rpm*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publicar la release
    needs: [windows, linux]
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5

      - name: Notas de la versión (mensaje de la etiqueta)
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -l --format='%(contents)' "$TAG" > release-notes.md
          cat release-notes.md

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: actions/download-artifact@v5
        with:
          path: bundles

      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/publish-release.mjs bundles
